name: pyhpc
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.7
  - pip
  #- libblas=*=*mkl
  - mkl
  - numpy
  - scipy
  - cython
  - pybind11
  - matplotlib
  - pandas
  - line_profiler
  - gcc_linux-64
  - gxx_linux-64
  - gfortran_linux-64
  - numba
  - mpich
  - mpi4py
  - hdf5=*=mpi*
  - h5py=*=mpi*
