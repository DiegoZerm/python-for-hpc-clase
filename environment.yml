# Packages required to build a Docker image for Binder
name: pyhpc
channels:
  - conda-forge
dependencies:
  - python
  - pip
  - numpy
  - scipy
  - cython
  - numba
  - matplotlib
  - line_profiler
  - gcc_linux-64
  - gxx_linux-64
  - gfortran_linux-64
  - mpich
  - mpi4py
  - hdf5=*=mpi*
  - h5py=*=mpi*
  - pandas
