# Packages required for running the examples from MPCDF's Python for HPC course:
name: pyhpc
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - libopenblas=*=*openmp*
  - numpy
  - scipy
  - cython
  - pybind11
  - pandas
  - matplotlib
  - line_profiler
  - gcc_linux-64
  - gxx_linux-64
  - gfortran_linux-64
  - numba
  - jax
  - dask
  - graphviz
  - python-graphviz
  - mpich
  - mpi4py
  - hdf5=*=mpi*
  - h5py=*=mpi*
  # - jupyterlab
  # - notebook
