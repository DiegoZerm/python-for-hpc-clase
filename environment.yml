# Packages required for "Python for HPC"
name: pyhpc
channels:
  - conda-forge
dependencies:
  - python=3.7
  - pip
  - libopenblas=*=*openmp*
  - numpy
  - scipy
  - cython
  - pybind11
  - pandas
  - matplotlib
  - line_profiler
  - gcc_linux-64
  - gxx_linux-64
  - gfortran_linux-64
  - numba
  - mpich
  - mpi4py
  - hdf5=*=mpi*
  - h5py=*=mpi*
